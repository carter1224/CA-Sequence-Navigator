name: Build EXE (Release)

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycomm3 pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconsole --onefile --icon CA.ico --add-data "CA.png;." seq_tester.py

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/seq_tester.exe
