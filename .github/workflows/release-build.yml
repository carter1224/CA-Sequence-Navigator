name: Release Build (Sequence Navigator)

on:
  release:
    types: [published]

permissions:
  contents: write

# Pinned so a tagged release rebuilds byte-for-byte. Bump deliberately, not by drift.
env:
  PYTHON_VERSION: "3.13.1"
  PIP_VERSION: "26.2"
  PYCOMM3_VERSION: "1.2.16"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish SequenceNavigator.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Download embeddable Python
        run: |
          $version = "${{ env.PYTHON_VERSION }}"
          $zipUrl = "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath "publish\\python" -Force

      - name: Install Python dependencies
        run: |
          $pth = Get-ChildItem -Path "publish\\python" -Filter "python*._pth" | Select-Object -First 1
          if (-not $pth) { throw "python .pth not found" }
          (Get-Content $pth.FullName) -replace '#import site','import site' | Set-Content $pth.FullName
          Add-Content $pth.FullName "Lib\\site-packages"
          New-Item -ItemType Directory -Path "publish\\python\\Lib\\site-packages" -Force | Out-Null
          Invoke-WebRequest -Uri https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          # get-pip.py itself is unversioned upstream, so pin the pip it installs.
          & "publish\\python\\python.exe" get-pip.py --no-warn-script-location "pip==$env:PIP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "get-pip failed with exit code $LASTEXITCODE" }
          & "publish\\python\\python.exe" -m pip install --no-warn-script-location "pycomm3==$env:PYCOMM3_VERSION" -t "publish\\python\\Lib\\site-packages"
          if ($LASTEXITCODE -ne 0) { throw "pycomm3 install failed with exit code $LASTEXITCODE" }
          Remove-Item get-pip.py

      - name: Copy content files
        run: |
          Copy-Item -Path "SEQ_DataType.L5X" -Destination "publish" -Force
          Copy-Item -Path "seq_exporter.py" -Destination "publish" -Force
          Copy-Item -Path "seq_importer.py" -Destination "publish" -Force

      - name: Package
        run: |
          $zip = "Sequence_Navigator_Windows_x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "publish\\*" -DestinationPath $zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Sequence_Navigator_Windows_x64.zip
